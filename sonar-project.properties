# SonarCloud Project Configuration
# https://docs.sonarsource.com/sonarcloud/

# Project identification
sonar.projectKey=guyinwonder168_opencode-glm-quota
sonar.organization=guyinwonder168
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=OpenCode GLM Quota Plugin
sonar.projectVersion=1.8.0

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.language=ts
#sonar.typescript.lcov.reportPaths has deprecated https://docs.sonarsource.com/sonarqube-server/9.8/analyzing-source-code/test-coverage/javascript-typescript-test-coverage
#sonar.typescript.lcov.reportPaths=coverage/lcov.info


# Exclusions
sonar.exclusions=**/*.test.ts,dist/**,node_modules/**,coverage/**,src/index.ts

# JavaScript/TypeScript analysis
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage thresholds
sonar.coverage.minimum=85.0

# Disable automatic analysis (we use CI analysis)
sonar.automatic.analysis.disabled=true

# Analysis parameters
sonar.scm.revision=${GITHUB_SHA}
sonar.scm.provider=git
